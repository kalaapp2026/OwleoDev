org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Kotlin's incremental compiler can't compute a relative path when the Gradle project (D:) and the
# pub cache it compiles plugin sources from (C:) sit on different Windows drive roots - it throws
# "this and base files have different roots" and fails the build. Incremental compilation is a
# speed optimization only; disabling it just makes rebuilds a bit slower, not incorrect.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
