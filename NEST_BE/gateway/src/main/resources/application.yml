server:
  port: 8080

spring:
  application:
    name: gateway
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: 20
            redis-rate-limiter.burstCapacity: 40
            key-resolver: "#{@ipKeyResolver}"
      routes:
        - id: identity-service
          uri: http://${IDENTITY_SERVICE_HOST:localhost}:${IDENTITY_SERVICE_PORT:8081}
          predicates:
            - Path=/api/identity/**
          filters:
            - StripPrefix=2

        - id: academy-service
          uri: http://${ACADEMY_SERVICE_HOST:localhost}:${ACADEMY_SERVICE_PORT:8082}
          predicates:
            - Path=/api/academy/**
          filters:
            - StripPrefix=2

        - id: curriculum-service
          uri: http://${CURRICULUM_SERVICE_HOST:localhost}:${CURRICULUM_SERVICE_PORT:8083}
          predicates:
            - Path=/api/curriculum/**
          filters:
            - StripPrefix=2

        - id: enrolment-service
          uri: http://${ENROLMENT_SERVICE_HOST:localhost}:${ENROLMENT_SERVICE_PORT:8084}
          predicates:
            - Path=/api/enrolment/**
          filters:
            - StripPrefix=2

        - id: scheduling-service
          uri: http://${SCHEDULING_SERVICE_HOST:localhost}:${SCHEDULING_SERVICE_PORT:8085}
          predicates:
            - Path=/api/scheduling/**
          filters:
            - StripPrefix=2

        - id: attendance-service
          uri: http://${ATTENDANCE_SERVICE_HOST:localhost}:${ATTENDANCE_SERVICE_PORT:8086}
          predicates:
            - Path=/api/attendance/**
          filters:
            - StripPrefix=2

        - id: fees-service
          uri: http://${FEES_SERVICE_HOST:localhost}:${FEES_SERVICE_PORT:8087}
          predicates:
            - Path=/api/fees/**
          filters:
            - StripPrefix=2

        - id: event-service
          uri: http://${EVENT_SERVICE_HOST:localhost}:${EVENT_SERVICE_PORT:8088}
          predicates:
            - Path=/api/events/**
          filters:
            - StripPrefix=2

        - id: social-service
          uri: http://${SOCIAL_SERVICE_HOST:localhost}:${SOCIAL_SERVICE_PORT:8089}
          predicates:
            - Path=/api/social/**
          filters:
            - StripPrefix=2

        - id: notification-service
          uri: http://${NOTIFICATION_SERVICE_HOST:localhost}:${NOTIFICATION_SERVICE_PORT:8090}
          predicates:
            - Path=/api/notifications/**
          filters:
            - StripPrefix=2

        - id: media-service
          uri: http://${MEDIA_SERVICE_HOST:localhost}:${MEDIA_SERVICE_PORT:8091}
          predicates:
            - Path=/api/media/**
          filters:
            - StripPrefix=2

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
