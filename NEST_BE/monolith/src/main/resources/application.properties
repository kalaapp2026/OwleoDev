server.port=8081

spring.application.name=nest-monolith

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSLMODE:prefer}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver
# Small pool for a small container - the default of 10 holds that many live DB connections (and
# their buffers) at once regardless of load, which is wasteful headroom on a 512Mi Render instance.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
# JdbcTemplate (used by the HQ console read models) has no Hibernate default_schema, so the
# connection itself must start in the app schema or plain SQL cannot see any table.
spring.datasource.hikari.schema=${DB_SCHEMA:nest}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:nest}

# Flyway creates this schema automatically if it doesn't exist (create-schemas defaults to true)
# and runs every migration against it instead of the connection's default "public" schema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=${DB_SCHEMA:nest}
# V68 (subscription payments) is still being finished locally while V69+ have shipped. Without this, the day V68
# is pushed, a database already past it refuses to start ("applied migration not resolved" / "detected resolved
# migration not applied"). It lets a lower-numbered migration that was never applied run later; it changes
# nothing for a database that has every migration.
spring.flyway.out-of-order=true

nest.jwt.secret=${NEST_JWT_SECRET:dev-only-change-me-dev-only-change-me-32b}
nest.jwt.issuer=nest
nest.jwt.access-token-expiry-minutes=15
nest.jwt.refresh-token-expiry-days=30

nest.crypto.key=${NEST_CRYPTO_KEY:ZGV2LW9ubHktY2hhbmdlLW1lLTMyLWJ5dGVzLWtleSE=}
nest.crypto.hmac-key=${NEST_CRYPTO_HMAC_KEY:ZGV2LW9ubHktaG1hYy1rZXktZGV2LW9ubHktMzJieQ==}

springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info

logging.level.com.nest=INFO

# Cap matches the largest per-file limit in the services (25 MB study-material audio); each service still enforces its own smaller limit, e.g. 5 MB for images.
# Profile picture uploads (dev-only local disk storage, served back statically - see FileStorageService).
nest.upload.dir=${NEST_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB

# Password-reset codes (SmtpEmailSender). Defaults point at the MailHog dev container from
# infra/docker-compose.yml (localhost:1025, no auth, no TLS) - `docker compose up mailhog` and read
# sent mail at http://localhost:8025. Production overrides every MAIL_* var to a real provider.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
nest.mail.from=${MAIL_FROM:no-reply@owleo.app}
# Adding spring-boot-starter-mail auto-registers a health indicator that pings the SMTP server -
# without this, /actuator/health (what Render's readiness probe hits) goes DOWN whenever mail is
# unreachable, even though password-reset failing to send is not "the app is broken."
management.health.mail.enabled=false

# Placeholder online payment - settles fees without moving money, so OFF unless explicitly enabled.
nest.payments.mock-enabled=${NEST_PAYMENTS_MOCK_ENABLED:false}

# Razorpay. Online payment is ON only when both the key id and secret are set - use rzp_test_ keys
# until the account is live. The webhook secret is the one typed into Razorpay's dashboard when the
# webhook is created (Account & Settings > Webhooks, event payment.captured), URL
# https://<host>/payments/razorpay/webhook. Never commit real values.
nest.razorpay.key-id=${RAZORPAY_KEY_ID:}
nest.razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
nest.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:}

# Notification channels. In-app always works; push and WhatsApp stay off (deliveries logged as SKIPPED)
# until credentials are supplied. Push: path to a Firebase service-account JSON, or the JSON itself.
# WhatsApp: Meta Cloud API token + phone-number id; templates are named in the Super Admin console.
nest.push.fcm.credentials=${NEST_FCM_CREDENTIALS:}
nest.whatsapp.access-token=${NEST_WHATSAPP_TOKEN:}
nest.whatsapp.phone-number-id=${NEST_WHATSAPP_PHONE_NUMBER_ID:}
nest.whatsapp.default-country-code=${NEST_WHATSAPP_COUNTRY_CODE:91}
nest.whatsapp.language=${NEST_WHATSAPP_LANGUAGE:en}
