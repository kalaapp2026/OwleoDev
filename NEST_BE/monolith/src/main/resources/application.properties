server.port=8081

spring.application.name=nest-monolith

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=${DB_SSLMODE:prefer}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:nest}

# Flyway creates this schema automatically if it doesn't exist (create-schemas defaults to true)
# and runs every migration against it instead of the connection's default "public" schema.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.schemas=${DB_SCHEMA:nest}

nest.jwt.secret=${NEST_JWT_SECRET:dev-only-change-me-dev-only-change-me-32b}
nest.jwt.issuer=nest
nest.jwt.access-token-expiry-minutes=15
nest.jwt.refresh-token-expiry-days=30

nest.crypto.key=${NEST_CRYPTO_KEY:ZGV2LW9ubHktY2hhbmdlLW1lLTMyLWJ5dGVzLWtleSE=}
nest.crypto.hmac-key=${NEST_CRYPTO_HMAC_KEY:ZGV2LW9ubHktaG1hYy1rZXktZGV2LW9ubHktMzJieQ==}

springdoc.swagger-ui.path=/swagger-ui.html

management.endpoints.web.exposure.include=health,info

logging.level.com.nest=INFO

# Profile picture uploads (dev-only local disk storage, served back statically - see FileStorageService).
nest.upload.dir=${NEST_UPLOAD_DIR:./uploads}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
